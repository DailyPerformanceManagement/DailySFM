n" type="submit">Einstellungen speichern</button></div></form></section><div class="grid-two">${panel('Supabase-Verbindung','Unabhängige Infrastruktur',`<p class="small-muted">Projekt: <b>${esc(config.projectRef)}</b></p><p class="small-muted">Region: <b>eu-central-1 · Frankfurt</b></p><p class="small-muted">Modus: <b>${state.mode==='cloud'?'Cloud mit Authentifizierung':'Lokal / Demo'}</b></p><div class="row" style="margin-top:14px"><button class="btn btn-outline" data-action="${state.mode==='cloud'?'signout':'auth'}">${state.mode==='cloud'?'Abmelden':'Cloud verbinden'}</button></div>`)}${panel('Datenschutz & Bedienung','',`<div class="record-list"><div class="record-item"><strong>Nur eigene Daten</strong><span class="pill ok">RLS aktiv</span></div><div class="record-item"><strong>Kein Schreibzugriff auf alte Projekte</strong><span class="pill ok">Getrennt</span></div><div class="record-item"><strong>Demo ↔ Cloud</strong><span class="small-muted">keine automatische Übertragung</span></div></div><div class="row" style="margin-top:15px"><button class="btn btn-outline" data-action="export-csv">KPI CSV</button>${state.mode==='demo'?`<button class="btn btn-red" data-action="reset-demo">Demo zurücksetzen</button>`:''}</div>`)}</div>`}

const MODEL={
 kpi_definitions:['id','user_id','code','title','unit','direction','target_value','warning_delta','critical_delta','sort_order'],
 daily_kpi_entries:['id','user_id','kpi_id','entry_date','value','note'],
 problems:['id','user_id','kpi_id','title','description','observed_on','status','priority','containment','root_cause','why_analysis','fishbone','verification'],
 actions:['id','user_id','problem_id','title','owner_name','due_date','status','priority','notes'],
 projects:['id','user_id','title','owner_name','objective','due_date','progress','status'],
 meetings:['id','user_id','title','starts_at','ends_at','location','participants','agenda','minutes','kind']
};
function cleanRecord(table,record){return Object.fromEntries(MODEL[table].filter(k=>record[k]!==undefined).map(k=>[k,record[k]]));}
function setRoute(route){if(!ROUTES[route])return;state.route=route;location.hash=route;render();window.scrollTo(0,0);$('#sidebar')?.classList.remove('opened');}
function safeMessage(e){return String(e?.message||e||'Unbekannter Fehler').slice(0,240)}
async function upsertRecord(table,record,conflict){
 if(!MODEL[table])throw new Error('Ungültige Tabelle');
 const row=cleanRecord(table,record);
 if(state.mode==='cloud'){
  const query=state.client.from(table).upsert(row,conflict?{onConflict:conflict}:{}).select().single();
  const {data,error}=await query;if(error)throw error;
  const i=state.data[table].findIndex(x=>x.id===data.id);
  if(i<0)state.data[table].push(data);else state.data[table][i]=data;
  return data;
 }
 const i=state.data[table].findIndex(x=>x.id===row.id);
 if(i<0)state.data[table].push(row);else state.data[table][i]={...state.data[table][i],...row};
 persist();return row;
}
async function loadCloud(){
 const loaded={};
 for(const t of TABLES){const {data,error}=await state.client.from(t).select('*').limit(3000);if(error)throw error;loaded[t]=data||[];}
 if(!loaded.kpi_definitions.length){
  const defs=META.map((m,i)=>({code:m.code,title:m.title,unit:m.unit,direction:m.direction,sort_order:i+1,target_value:null,warning_delta:null,critical_delta:null}));
  const {data,error}=await state.client.from('kpi_definitions').insert(defs).select('*');if(error)throw error;loaded.kpi_definitions=data;
 }
 state.data=loaded;state.mode='cloud';state.selectedKpi='produktivitaet';render();
}
async function ensureSupabaseSDK(){
 if(window.supabase?.createClient)return;
 await new Promise((resolve,reject)=>{
  const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.81.1/dist/umd/supabase.js';sc.onload=resolve;sc.onerror=()=>reject(new Error('Supabase-Bibliothek nicht geladen: Bitte Internetverbindung prüfen.'));document.head.append(sc);
 });
 if(!window.supabase?.createClient)throw new Error('Supabase-Bibliothek konnte nicht gestartet werden.');
}
async function cloudLogin(email,password,register){throw new Error('Cloud access is disabled in the separate DailySFM Lab. Use the local demo and export backups.');
 await ensureSupabaseSDK();
 if(!state.client)state.client=window.supabase.createClient(config.supabaseUrl,config.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const {data,error}=register?await state.client.auth.signUp({email,password}):await state.client.auth.signInWithPassword({email,password});
 if(error)throw error;
 if(!data.session){toast('Konto erstellt. Bitte Bestätigungsmail prüfen, danach anmelden.');return;}
 state.user=data.user;await loadCloud();toast('Supabase verbunden: privater Arbeitsbereich aktiv');

function field(name,label,value='',type='text',opts=''){

 if(type==='select'){return `<div class="field"><label for="f_${attr(name)}">${esc(label)}</label><select id="f_${attr(name)}" name="${attr(name)}">${opts.split('|').map(item=>{const [key,title]=item.split(':');return `<option value="${attr(key)}" ${key===value?'selected':''}>${esc(title||key)}</option>`}).join('')}</select></div>`}
 return `<div class="field"><label for="f_${attr(name)}">${esc(label)}</label><input id="f_${attr(name)}" name="${attr(name)}" type="${type}" value="${attr(value??'')}" ${opts}></div>`;
}

 '<div class="eyebrow" style="margin:16px 0 8px">ISHIKAWA · 6M</div>'+['Mensch','Maschine','Material','Methode','Milieu','Messung'].map(x=>field('fish_'+x,x,(p.fishbone||{})[x]||'','textarea')).join('')+

function toDatetimeLocal(iso){if(!iso)return '';const d=new Date(iso),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function defaultTime(){const d=new Date();d.setMinutes(0,0,0);d.setHours(d.getHours()+1);return toDatetimeLocal(d.toISOString())}
function modalMeeting(id){const m=state.data.meetings.find(x=>x.id===id)||{};const d=defaultTime();const e=toDatetimeLocal(new Date(new Date(d).getTime()+3600000).toISOString());
 const f=field('title','Titel der Besprechung *',m.title||'','text','required maxlength="180"')+field('starts_at','Beginn',toDatetimeLocal(m.starts_at)||d,'datetime-local','required')+
 field('ends_at','Ende',toDatetimeLocal(m.ends_at)||e,'datetime-local','required')+
 field('kind','Art',m.kind||'daily','select','daily:Daily Meeting|shopfloor:Shopfloor Meeting|pdca:PDCA Review|kaizen:Kaizen Workshop|other:Sonstige')+
 field('location','Ort / Meeting-Link',m.location||'')+field('participants','Teilnehmer (Namen/E-Mails)',m.participants||'','textarea')+
 field('agenda','Agenda',m.agenda||'','textarea')+field('minutes','Protokoll / Beschlüsse',m.minutes||'','textarea');
 openModal(m.id?'Meeting bearbeiten':'Neue Besprechung',f,async form=>{const start=new Date(val(form,'starts_at')),end=new Date(val(form,'ends_at'));if(!(end>start))throw Error('Ende muss nach Beginn liegen');const r={...m,...valuesToRecord(form,['title','kind','location','participants','agenda','minutes']),id:m.id||freshId(),user_id:ownerId(),starts_at:start.toISOString(),ends_at:end.toISOString()};await upsertRecord('meetings',r);closeModal();render();toast('Termin gespeichert · Einladung als .ics exportierbar')});
}
function downloadText(name,text,type='text/plain;charset=utf-8'){
 const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);
}
function exportCsv(){const rows=[['Datum','Kennzahl','Wert','Einheit','Ziel','Status','Kommentar']];for(const e of state.data.daily_kpi_entries){const d=metricById(e.kpi_id);if(!d)continue;rows.push([e.entry_date,d.title,e.value,d.unit,d.target_value??'',statusFor(d,e.value).name,e.note||''])}const q=x=>'"'+String(x??'').replaceAll('"','""')+'"';downloadText('lean-kpi-export.csv','\ufeff'+rows.map(row=>row.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function exportReport(){const d=state.selectedDate;const lines=[`LEAN COMMAND CENTER | Tagesprotokoll ${fmtDate(d)}`,'',...definitions().map(k=>{const e=entryFor(k.id,d);return `${k.title}: ${e?fmtNum(e.value,2)+' '+k.unit:'nicht erfasst'} / ${statusFor(k,e?.value).name}`}),'',`Maßnahmen offen: ${state.data.actions.filter(x=>x.status!=='done').length}`,'',...state.data.actions.filter(x=>x.status!=='done').map(a=>`• ${a.title} | ${a.owner_name||'Ohne Owner'} | Fällig: ${a.due_date||'offen'}`)];downloadText('tagesprotokoll-'+d+'.txt',lines.join('\n'))}
function exportICS(m){const safe=t=>String(t??'').replaceAll('\\','\\\\').replaceAll('\n','\\n').replaceAll(',','\\,').replaceAll(';','\\;');const stamp=x=>new Date(x).toISOString().replace(/[-:]/g,'').replace('.000','');const s=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//DailySFM Lab//DE','BEGIN:VEVENT',`UID:${m.id||uid()}@lean-command-center`,`DTSTAMP:${stamp(new Date())}`,`DTSTART:${stamp(m.starts_at)}`,`DTEND:${stamp(m.ends_at)}`,`SUMMARY:${safe(m.title)}`,`DESCRIPTION:${safe([m.agenda,m.minutes].filter(Boolean).join('\n'))}`,`LOCATION:${safe(m.location)}`,'END:VEVENT','END:VCALENDAR'].join('\r\n');downloadText('meeting-'+(m.starts_at||today()).slice(0,10)+'.ics',s,'text/calendar;charset=utf-8')}
async function saveEntries(form){const date=val(form,'entry_date');if(!date)throw Error('Bitte Datum wählen');const note=val(form,'note');let saved=0;
 for(const d of definitions()){
  const raw=val(form,'v_'+d.code);if(raw==='')continue;
  const value=Number(raw.replace(',','.'));if(!Number.isFinite(value))throw Error('Ungültiger Zahlenwert: '+d.title);
  const existing=entryFor(d.id,date);
  await upsertRecord('daily_kpi_entries',{id:existing?.id||freshId(),user_id:ownerId(),kpi_id:d.id,entry_date:date,value,note},'user_id,kpi_id,entry_date');saved++;
 }
 if(!saved)throw Error('Bitte mindestens einen KPI-Wert erfassen');state.selectedDate=date;render();toast(`${saved} Tageswert${saved===1?'':'e'} gespeichert`);
}
async function saveSettings(form){for(const d of definitions()){
 const changed={...d,unit:val(form,'unit_'+d.code),direction:val(form,'direction_'+d.code),target_value:number(val(form,'target_'+d.code)),warning_delta:number(val(form,'warning_'+d.code))};
 if(changed.warning_delta!=null&&changed.warning_delta<0)throw Error('Warnabweichung darf nicht negativ sein');
 await upsertRecord('kpi_definitions',changed,'user_id,code');
 }render();toast('KPI-Zielwerte gespeichert');
}
function modalAuth(){toast('Cloud-Anmeldung ist in DailySFM Lab deaktiviert.');return;const fields='<p class="hint">Privater Supabase-Arbeitsbereich. Kein Demo-Datensatz wird automatisch übertragen. Bei Neuanmeldung kann eine E-Mail-Bestätigung erforderlich sein.</p>'+field('email','E-Mail-Adresse','','email','required autocomplete="email"')+field('password','Passwort (mindestens 6 Zeichen)','','password','required minlength="6" autocomplete="current-password"')+field('account_mode','Aktion','login','select','login:Anmelden|register:Neues Konto anlegen');openModal('Supabase verbinden',fields,async form=>{await cloudLogin(val(form,'email'),val(form,'password'),val(form,'account_mode')==='register');closeModal();render()});}
async function handleAction(el){const a=el.dataset.action,id=el.dataset.id;
 switch(a){
 case 'goto-entry':setRoute('entry');break;case 'goto-settings':setRoute('settings');break;
 case 'pick-kpi':case 'kpi-only':state.selectedKpi=el.dataset.kpi;setRoute('analysis');break;
 case 'range':state.range=Number(el.dataset.value);render();break;
 case 'date-today':state.selectedDate=today();render();break;
 case 'edit-date':state.selectedDate=el.dataset.date;setRoute('entry');break;
 case 'new-problem':modalProblem(null,el.dataset.kpi);break;case 'edit-problem':modalProblem(id);break;
 case 'new-action':modalAction(null,el.dataset.problem);break;case 'edit-action':modalAction(id);break;
 case 'new-project':modalProject();break;case 'edit-project':modalProject(id);break;
 case 'new-meeting':modalMeeting();break;case 'edit-meeting':modalMeeting(id);break;
 case 'prev-month':state.calMonth=shiftMonth(state.calMonth,-1);render();break;
 case 'next-month':state.calMonth=shiftMonth(state.calMonth,1);render();break;
 case 'this-month':state.calMonth=today().slice(0,7)+'-01';render();break;
 case 'ics':{const m=state.data.meetings.find(x=>x.id===id);if(m)exportICS(m);break;}
 case 'export-csv':exportCsv();toast('CSV exportiert');break;
 case 'export-report':exportReport();toast('Tagesprotokoll exportiert');break;
 case 'backup':downloadText('lean-command-center-backup.json',JSON.stringify({exportedAt:new Date().toISOString(),mode:state.mode,data:state.data},null,2),'application/json');toast('Backup exportiert');break;
 case 'reset-demo':if(state.mode==='demo'&&confirm('Beispieldaten im Browser wirklich zurücksetzen?')){localStorage.removeItem('lcc-demo-data-v2');state.data=demoFixture();render();toast('Demo zurückgesetzt')}break;
 case 'auth':modalAuth();break;
 case 'signout':await signOut();break;
 }
}
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-route]');if(nav){setRoute(nav.dataset.route);return;}
 const btn=e.target.closest('[data-action]');if(btn){handleAction(btn).catch(err=>{console.error(err);toast(safeMessage(err),true)})}
});
document.addEventListener('change',e=>{
 if(e.target.id==='selected-date'){state.selectedDate=e.target.value||today();render()}
 if(e.target.id==='daily-date'){state.selectedDate=e.target.value||today();render()}
 if(e.target.dataset.action==='status-action'){
  const a=state.data.actions.find(x=>x.id===e.target.dataset.id);if(a)upsertRecord('actions',{...a,status:e.target.value}).then(()=>{render();toast('Status gespeichert')}).catch(err=>toast(safeMessage(err),true));
 }
});
document.addEventListener('submit',e=>{
 if(!['entry-form','settings-form','modal-form'].includes(e.target.id))return;e.preventDefault();const form=e.target;
 const task=form.id==='entry-form'?saveEntries(form):form.id==='settings-form'?saveSettings(form):state.modalSubmit?.(form);
 Promise.resolve(task).catch(err=>{console.error(err);toast(safeMessage(err),true)});
});
$('#close-modal').addEventListener('click',closeModal);
$('#cancel-modal').addEventListener('click',closeModal);
$('#auth-button').addEventListener('click',()=>state.mode==='cloud'?setRoute('settings'):modalAuth());
$('#profile-button').addEventListener('click',()=>setRoute('settings'));
$('#mobile-menu').addEventListener('click',()=>$('#sidebar').classList.toggle('opened'));
window.addEventListener('hashchange',()=>{const route=location.hash.replace('#','');if(ROUTES[route]&&route!==state.route){state.route=route;render()}});
async function initialize(){
 const fromHash=location.hash.replace('#','');if(ROUTES[fromHash])state.route=fromHash;
 render();
 // Cloud sessions are opt-in; a returning authenticated user is resumed if client library loaded.
 if(config.supabaseUrl&&config.supabasePublishableKey&&localStorage.getItem('sb-'+config.projectRef+'-auth-token')){
  try{await ensureSupabaseSDK();state.client=window.supabase.createClient(config.supabaseUrl,config.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
   const {data,error}=await state.client.auth.getSession();if(error)throw error;
   if(data?.session?.user){state.user=data.session.user;await loadCloud()}
  }catch(err){console.warn('Cloud session could not load:',err);toast('Demo aktiv; Cloud-Sitzung konnte nicht geladen werden',true)}
 }
}
initialize();

</script>
</body></html>
