name: Restore original Claude DPM safely into DailySFM

on:
  push:
    paths:
      - ".github/workflows/restore-dpm.yml"
      - "scripts/import_dpm.py"
      - "scripts/smoke-test.cjs"
      - "scripts/eacs-smoke.cjs"
      - "dailysfm-eacs.js"
      - "six-sigma.js"
      - "six-sigma.html"
      - "dailysfm-modules.js"
      - "dailysfm-modules.css"
      - "six-sigma-integrated.css"
      - "six-sigma-dpm-context.js"
      - "scripts/workbench-smoke.cjs"
  workflow_dispatch:

concurrency:
  group: dailysfm-original-clone
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  import-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout DailySFM (never DPM)
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Import pinned original Claude source with B+K removed
        run: python3 scripts/import_dpm.py

      - name: Verify browser scripts compile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          source = Path("index.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script(?: [^>]*)?>(.*?)</script>", source, flags=re.S)
          for i, block in enumerate(blocks):
              path = Path(tempfile.gettempdir()) / f"dailysfm-original-{i}.js"
              path.write_text(block, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
          print("PASS:", len(blocks), "inline script blocks compile")
          PY

      - name: Install headless browser
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install chromium-headless-shell

      - name: Verify original cockpit renders without B+K requests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/dailysfm-http.log 2>&1 &
          sleep 2
          node scripts/smoke-test.cjs

      - name: Validate EACS frontend scripts
        run: |
          node --check dailysfm-eacs.js
          node --check six-sigma.js
          node --check scripts/eacs-smoke.cjs

      - name: Exercise mocked EACS KPI and Six Sigma saving in browser
        run: node scripts/eacs-smoke.cjs

      - name: Validate native DailySFM Six Sigma integration
        run: |
          node --check dailysfm-modules.js
          node --check six-sigma-dpm-context.js
          node --check scripts/workbench-smoke.cjs
          node scripts/workbench-smoke.cjs

      - name: Publish verified original to independent DailySFM only
        run: |
          git config user.name "DailySFM import bot"
          git config user.email "dailysfm-import@users.noreply.github.com"
          git add index.html projekte.html hilfe/
          if git diff --cached --quiet; then
            echo "Original copy already up to date"
          else
            git commit -m "Replace prototype with verified original Claude DPM offline copy"
            git push origin HEAD:main
          fi
